[workspace]
resolver = "2"
members = ["crates/codeate-core", "crates/codeate-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
