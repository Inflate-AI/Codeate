[workspace]
resolver = "2"
members = ["crates/codeate-core", "crates/codeate-cli", "crates/codeate-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
syn = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
rustpython-parser = "0.4"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
